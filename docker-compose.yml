version: "3.8"
services:
  db:
    image: postgres:latest
    container_name: postgres-db
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: scalable
      POSTGRES_PASSWORD: admin123
    ports:
      - "5432:5432"

  app:
    image: payments-service:1.0.1
    container_name: payments-service
    ports:
      - "9099:9099"
    extra_hosts:
      - "localhost:host-gateway"
